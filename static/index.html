
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Portable Notes 2.10</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="app">
<aside class="rail"><div class="logo">P</div><button id="new" title="New note">＋</button><button id="all" class="active" title="All notes">▤</button><button id="daily" title="Daily note">◫</button><button id="fav" title="Favorites">★</button><div class="grow"></div><button id="theme" title="Theme">◐</button><a href="/api/export" title="Export vault">⇩</a></aside>
<aside class="nav"><div class="brand"><b>Portable Notes</b><small>FOCUS 2.10</small></div><div class="search"><span>⌕</span><input id="q" placeholder="Search your vault"><kbd>Ctrl K</kbd></div><div class="navhead"><b id="navtitle">Notes</b><button id="folder" title="New folder">＋</button></div><div id="tree" class="tree"></div><div class="navhead"><b>Recent</b><span id="count"></span></div><div id="list" class="list"></div></aside>
<main><header><input id="title" class="title" placeholder="Untitled"><span id="state">Ready</span><button id="pin" title="Pin">⌖</button><button id="star" title="Favorite">☆</button><button id="mode">Preview</button><button id="commands" title="Commands">⌘</button></header><div class="props"><label>Folder <input id="folderName"></label><label>Tags <input id="tags" placeholder="tag, another"></label><span id="updated"></span></div><div id="tabs" class="tabs"></div><section id="work"><textarea id="editor" spellcheck="true" placeholder="Start writing in Markdown…"></textarea><article id="preview" class="markdown hidden"></article></section><footer><span id="words">0 words</span><span>Markdown</span><span id="vaultPath">Local vault</span></footer></main>
<aside class="context"><h3>Knowledge</h3><section><b>Outline</b><div id="outline"></div></section><section><b>Outgoing links</b><div id="links"></div></section><section><b>Backlinks</b><div id="backlinks"></div></section><section><b>Quick help</b><p><kbd>Ctrl N</kbd> New</p><p><kbd>Ctrl S</kbd> Save</p><p><kbd>Ctrl ⇧ P</kbd> Commands</p><p><kbd>[[Title]]</kbd> Wiki link</p></section></aside>
</div><dialog id="palette"><input id="commandSearch" placeholder="Type a command…"><div id="commandList"></div></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
