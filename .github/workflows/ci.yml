name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile-check all Python modules
        run: python -m py_compile app.py core/tasks.py core/vault.py core/errors.py services/task_repository.py api/notes.py api/search.py api/system.py

      - name: Run E2E UI regression suite
        run: python tests/e2e_ui_actions.py
        env:
          CI: true
